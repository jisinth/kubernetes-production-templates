apiVersion: v1
kind: Namespace
metadata:
  name: staging
  labels:
    environment: staging
    # Staging mirrors production topology but with a looser PSA profile so
    # teams can reproduce edge cases (e.g. hostPath testing, debug sidecars)
    # without needing a namespace exception.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    description: "Pre-production validation environment. Mirrors production sizing at reduced scale."
    owner: "platform-team"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: staging-quota
  namespace: staging
spec:
  hard:
    requests.cpu: "20"
    requests.memory: 40Gi
    limits.cpu: "40"
    limits.memory: 80Gi
    requests.storage: 200Gi
    persistentvolumeclaims: "20"
    pods: "100"
    services: "30"
    services.loadbalancers: "2"
    secrets: "75"
    configmaps: "75"
    count/deployments.apps: "40"
    count/jobs.batch: "40"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: staging-limits
  namespace: staging
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: 10m
        memory: 32Mi
    - type: PersistentVolumeClaim
      max:
        storage: 50Gi
      min:
        storage: 1Gi
