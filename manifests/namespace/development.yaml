apiVersion: v1
kind: Namespace
metadata:
  name: development
  labels:
    environment: development
    # Development favors iteration speed. baseline blocks known-bad
    # configurations (host namespaces, privileged containers) while still
    # allowing the debugging patterns engineers rely on day to day.
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    description: "Developer sandbox. Workloads may be evicted or reset without notice."
    owner: "platform-team"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: development-quota
  namespace: development
spec:
  hard:
    requests.cpu: "10"
    requests.memory: 20Gi
    limits.cpu: "20"
    limits.memory: 40Gi
    requests.storage: 100Gi
    persistentvolumeclaims: "15"
    pods: "75"
    services: "20"
    services.loadbalancers: "1"
    secrets: "50"
    configmaps: "50"
    count/deployments.apps: "30"
    count/jobs.batch: "30"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: development-limits
  namespace: development
spec:
  limits:
    - type: Container
      default:
        cpu: 250m
        memory: 256Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
      max:
        cpu: "2"
        memory: 4Gi
      min:
        cpu: 10m
        memory: 32Mi
    - type: PersistentVolumeClaim
      max:
        storage: 20Gi
      min:
        storage: 1Gi
