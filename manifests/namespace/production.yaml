apiVersion: v1
kind: Namespace
metadata:
  name: production
  labels:
    environment: production
    # Pod Security Admission (PSA) — enforce the "restricted" profile in prod.
    # Any pod that requests privilege escalation, host namespaces, or runs
    # as root without an explicit override will be rejected at admission time.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
  annotations:
    description: "Production workloads. Changes require change-management approval."
    owner: "platform-team"
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: production-quota
  namespace: production
spec:
  hard:
    requests.cpu: "40"
    requests.memory: 80Gi
    limits.cpu: "80"
    limits.memory: 160Gi
    requests.storage: 500Gi
    persistentvolumeclaims: "40"
    pods: "200"
    services: "50"
    services.loadbalancers: "5"
    secrets: "100"
    configmaps: "100"
    count/deployments.apps: "60"
    count/jobs.batch: "50"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: production-limits
  namespace: production
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "4"
        memory: 8Gi
      min:
        cpu: 10m
        memory: 32Mi
    - type: PersistentVolumeClaim
      max:
        storage: 100Gi
      min:
        storage: 1Gi
