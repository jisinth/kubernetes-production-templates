# Standalone external-dns Deployment (alternative to the Helm chart).
# Assumes manifests/external-dns/rbac.yaml has already been applied.
# external-dns does not support active-active HA — run a single replica;
# if you need failover, rely on the Deployment controller to reschedule
# on node failure rather than running multiple replicas concurrently.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: external-dns
  namespace: external-dns
  labels:
    app.kubernetes.io/name: external-dns
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: Recreate   # avoid two replicas briefly reconciling DNS simultaneously during a rollout
  selector:
    matchLabels:
      app.kubernetes.io/name: external-dns
  template:
    metadata:
      labels:
        app.kubernetes.io/name: external-dns
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "7979"
    spec:
      serviceAccountName: external-dns
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: external-dns
          image: registry.k8s.io/external-dns/external-dns:v0.15.0
          imagePullPolicy: IfNotPresent
          args:
            - --source=service
            - --source=ingress
            - --provider=aws                     # swap for google/azure/cloudflare/etc.
            - --domain-filter=example.com
            - --policy=sync
            - --registry=txt
            - --txt-owner-id=production-cluster
            - --txt-prefix=external-dns-
            - --interval=1m
            - --log-level=info
            - --log-format=json
            # - --dry-run                          # uncomment when onboarding a new domain
          env:
            - name: AWS_DEFAULT_REGION
              value: us-east-1
          ports:
            - name: http
              containerPort: 7979
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 25m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 128Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
