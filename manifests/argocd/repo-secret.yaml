# Example repository-credentials Secret for a private Git repo.
#
# *** DO NOT commit real credentials in a Secret like this. ***
# This file uses obvious placeholder values so it is safe to keep in Git as
# a template. In practice:
#   1. Encrypt it with kubeseal (see manifests/sealed-secrets/) and commit
#      the resulting SealedSecret instead, or
#   2. Use an external secret store (External Secrets Operator, Vault) and
#      commit an ExternalSecret/SecretStore reference instead, or
#   3. Create it imperatively and never commit it at all:
#      argocd repo add https://github.com/your-org/your-private-repo.git \
#        --username <user> --password <token-or-app-password>
#
# The label argocd.argoproj.io/secret-type: repository is what makes Argo CD
# pick this Secret up as a repository credential.
apiVersion: v1
kind: Secret
metadata:
  name: private-repo-credentials
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: repository
type: Opaque
stringData:
  type: git
  url: https://github.com/your-org/your-private-repo.git
  # HTTPS with a PAT/app-password:
  username: REPLACE_ME_WITH_GIT_USERNAME
  password: REPLACE_ME_WITH_PLACEHOLDER_TOKEN
  # --- OR, for SSH instead of HTTPS, drop username/password and use: ---
  # sshPrivateKey: |
  #   REPLACE_ME_WITH_PLACEHOLDER_SSH_KEY
  # --- OR, for a GitHub App instead of a PAT: ---
  # githubAppID: "000000"
  # githubAppInstallationID: "000000"
  # githubAppPrivateKey: |
  #   REPLACE_ME_WITH_PLACEHOLDER_APP_KEY
