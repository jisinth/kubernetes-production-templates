# Example SealedSecret. A SealedSecret is safe to commit to a public Git
# repo: the "encryptedData" values are asymmetrically encrypted against the
# controller's public key and can only be decrypted by the controller
# running in the target cluster/namespace.
#
# The ciphertext below is a PLACEHOLDER — it is not a real sealed value and
# will not decrypt to anything. Never commit real kubeseal output that
# encrypts against a compromised or shared-beyond-need controller keypair
# without understanding your scope (see README.md "Security").
#
# How this file is generated in practice, from a plain Secret you never commit:
#
#   kubectl create secret generic db-credentials \
#     --namespace production \
#     --from-literal=username=app_user \
#     --from-literal=password='S3cr3tP@ssw0rd!' \
#     --dry-run=client -o yaml > /tmp/db-credentials.yaml
#
#   kubeseal --format=yaml \
#     --controller-name=sealed-secrets-controller \
#     --controller-namespace=kube-system \
#     < /tmp/db-credentials.yaml > sealedsecret-example.yaml
#
#   rm /tmp/db-credentials.yaml   # never leave the plaintext Secret on disk or in Git
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: db-credentials
  namespace: production
spec:
  encryptedData:
    username: AgBy3i4OJSWK+PiTySYZZA9rO43cGDEQAx1Yq2uzVv1uNQCVdVzM3EOhqcAyKKO6...PLACEHOLDER_CIPHERTEXT...==
    password: AgAKt2wZeWk1kMHZbA1B9xC7Vm4z6dqOo8RCf7cJ8xMK2VqTVQzTQxTfhAe1FuY4...PLACEHOLDER_CIPHERTEXT...==
  template:
    metadata:
      name: db-credentials
      namespace: production
    type: Opaque
