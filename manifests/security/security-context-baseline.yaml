# Reusable securityContext baseline at both the pod and container level.
# This isn't a standalone applyable resource — it's a documented snippet
# meant to be copied into your own Deployment/Pod specs (or merged in via
# Kustomize patches / a Helm _helpers.tpl). See
# ../pod-security/restricted-example.yaml for this same baseline embedded
# in a complete, applyable Deployment.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: security-context-baseline-reference
  namespace: default
  annotations:
    kubernetes-production-templates/purpose: >-
      Reference-only manifest documenting the recommended securityContext
      baseline. Copy the securityContext blocks below into real workloads;
      this Deployment is not meant to be the actual production workload.
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: security-context-baseline-reference
  template:
    metadata:
      labels:
        app.kubernetes.io/name: security-context-baseline-reference
    spec:
      # --- Pod-level securityContext -------------------------------------
      # Applies as the default for every container in the pod unless a
      # container overrides a given field.
      securityContext:
        runAsNonRoot: true # refuse to start if any container would run as root
        runAsUser: 10001 # arbitrary non-root UID; match your image's expectations
        runAsGroup: 10001
        fsGroup: 10001 # volume ownership for mounted PVCs/ConfigMaps/Secrets
        fsGroupChangePolicy: OnRootMismatch # avoid re-chowning large volumes on every restart
        seccompProfile:
          type: RuntimeDefault # opt in to the container runtime's default syscall filter
        # supplementalGroups: []          # add only if a shared volume needs a specific GID

      automountServiceAccountToken: false # opt in explicitly per-workload if the API is actually needed

      containers:
        - name: app
          image: your-registry/your-app:1.0.0
          # --- Container-level securityContext -----------------------------
          # Narrower and stricter than the pod-level context; container
          # settings win where both are set.
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false # blocks setuid binaries / sudo-style escalation
            readOnlyRootFilesystem: true # forces writes through explicit volumes only
            capabilities:
              drop:
                - ALL # start from zero Linux capabilities...
              # add:                          # ...and add back only what's proven necessary, e.g.:
              #   - NET_BIND_SERVICE          # only if binding to a port < 1024
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          volumeMounts:
            # readOnlyRootFilesystem means anything written at runtime
            # (temp files, caches, sockets) needs its own writable mount.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
