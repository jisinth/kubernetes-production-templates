# Let's Encrypt PRODUCTION issuer. Rate-limited (50 certs/registered domain
# per week as of this writing) — validate your setup against
# cluster-issuer-letsencrypt-staging.yaml first to avoid burning attempts.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: platform-team@example.com
    privateKeySecretRef:
      name: letsencrypt-prod-account-key
    solvers:
      - http01:
          ingress:
            ingressClassName: nginx
