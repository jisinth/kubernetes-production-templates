# Loki server configuration snippet (config.yaml).
# When installing via the Helm chart, this content is templated in via
# the `loki:` block in values.yaml/helm-values/loki.yaml — this file is
# the raw config for reference, for running Loki outside Helm, or for
# diffing against what the chart renders (`helm template ... | grep -A100
# 'config.yaml:'`).
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: info
  grpc_server_max_recv_msg_size: 104857600
  grpc_server_max_send_msg_size: 104857600

common:
  replication_factor: 3
  path_prefix: /var/loki
  ring:
    kvstore:
      store: memberlist

memberlist:
  join_members:
    - loki-memberlist

# --- Schema ------------------------------------------------------------
# v13 + tsdb is the current recommended combination for new installs.
# `from` is when this schema version takes effect — never edit an existing
# entry's `from` date retroactively; add a new dated entry instead when you
# change schema/object_store so historical chunks stay queryable.
schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: loki_index_
        period: 24h

# --- Storage -------------------------------------------------------------
# filesystem for small/eval deployments; swap to S3 for anything with
# multiple write replicas or that needs durability beyond a single PV.
storage_config:
  filesystem:
    directory: /var/loki/chunks
  tsdb_shipper:
    active_index_directory: /var/loki/tsdb-index
    cache_location: /var/loki/tsdb-cache
  # aws:
  #   bucketnames: my-org-loki-chunks
  #   region: us-east-1
  #   s3forcepathstyle: false

# --- Limits ----------------------------------------------------------
# Sane per-tenant defaults for a mid-size cluster. Tune ingestion_rate_mb
# and per_stream limits up if legitimate high-volume services are getting
# throttled (429s) — check `loki_discarded_samples_total` first to confirm
# it's actually limits and not a misbehaving/label-exploding client.
limits_config:
  retention_period: 336h            # 14 days
  ingestion_rate_mb: 10
  ingestion_burst_size_mb: 20
  per_stream_rate_limit: 5MB
  per_stream_rate_limit_burst: 20MB
  max_query_series: 5000
  max_query_parallelism: 32
  max_query_length: 721h
  max_entries_limit_per_query: 5000
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_label_names_per_series: 15
  max_label_value_length: 2048
  # Prevent a single misconfigured client from creating unbounded streams
  # (e.g. by labeling logs with request_id/user_id/pod_ip)
  max_streams_per_user: 10000
  max_global_streams_per_user: 10000

compactor:
  working_directory: /var/loki/compactor
  retention_enabled: true
  retention_delete_delay: 2h
  delete_request_store: filesystem
  compaction_interval: 10m

ruler:
  storage:
    type: local
    local:
      directory: /var/loki/rules
  rule_path: /tmp/loki/rules-temp
  alertmanager_url: http://alertmanager-operated.monitoring.svc:9093
  enable_api: true

analytics:
  reporting_enabled: false
