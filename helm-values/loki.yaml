# Helm values for Loki (log aggregation)
# Chart: grafana/loki (simple-scalable / SSD deployment mode)
# Usage: helm upgrade --install loki grafana/loki -n monitoring -f values.yaml
#
# This file is mirrored at helm-values/loki.yaml — keep both in sync.
#
# deploymentMode: SimpleScalable splits Loki into read/write/backend
# targets sharing one config, which scales further than single-binary
# mode without the operational overhead of full microservices mode.
# Start with SingleBinary for small clusters/dev and graduate to
# SimpleScalable once ingest volume or query concurrency demands it.
deploymentMode: SimpleScalable

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 3

  # --- Storage ------------------------------------------------------
  # filesystem is fine for evaluation/small clusters; swap to S3 (or GCS/
  # Azure Blob) for anything you need durable beyond a single PV, and
  # required outright once you run more than one write replica.
  storage:
    type: filesystem
    # type: s3
    # bucketNames:
    #   chunks: my-org-loki-chunks
    #   ruler: my-org-loki-ruler
    #   admin: my-org-loki-admin
    # s3:
    #   region: us-east-1
    #   # Prefer IRSA/workload identity over static keys. If static keys are
    #   # unavoidable, source them from a Secret, never inline here:
    #   # secretAccessKey / accessKeyId via `loki.storage.s3.secretAccessKey`
    #   # pulled from an existingSecret in real deployments.
    #   s3ForcePathStyle: false

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem   # switch to `s3` alongside storage.type above
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    retention_period: 336h   # 14 days; tune to compliance/cost requirements
    ingestion_rate_mb: 10
    ingestion_burst_size_mb: 20
    per_stream_rate_limit: 5MB
    per_stream_rate_limit_burst: 20MB
    max_query_series: 5000
    max_query_parallelism: 32
    reject_old_samples: true
    reject_old_samples_max_age: 168h

  compactor:
    retention_enabled: true
    delete_request_store: filesystem

singleBinary:
  replicas: 0   # disabled; using SimpleScalable read/write/backend below

read:
  replicas: 2
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  persistence:
    storageClass: gp3
    size: 10Gi

write:
  replicas: 3
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  persistence:
    storageClass: gp3
    size: 20Gi

backend:
  replicas: 2
  resources:
    requests:
      cpu: 200m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 1Gi
  persistence:
    storageClass: gp3
    size: 10Gi

gateway:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi

# Promtail/Grafana Alloy is deployed separately as the log-shipping
# DaemonSet; disable Loki's own (deprecated) built-in test client.
test:
  enabled: false

monitoring:
  serviceMonitor:
    enabled: true
    labels:
      release: kube-prometheus-stack
  selfMonitoring:
    enabled: false   # avoid double-scraping; kube-prometheus-stack ServiceMonitor above covers this
  lokiCanary:
    enabled: true    # synthetic canary logs to verify the read path end-to-end
