# deployment.yaml — Flask app served by gunicorn
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flask-app
  namespace: default
  labels:
    app.kubernetes.io/name: flask-app
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: flask-app-service
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: flask-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: flask-app
        app.kubernetes.io/component: backend
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: flask-app
          image: your-registry/flask-app:1.0.0
          imagePullPolicy: IfNotPresent
          command: ["gunicorn"]
          args:
            - "--bind=0.0.0.0:8000"
            - "--workers=4"
            - "--threads=2"
            - "--worker-class=gthread"
            - "--timeout=30"
            - "--graceful-timeout=30"
            - "--access-logfile=-"
            - "--error-logfile=-"
            - "wsgi:app"
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: flask-app-config
            - secretRef:
                name: flask-app-secret
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: instance
              mountPath: /app/instance
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: instance
          persistentVolumeClaim:
            claimName: flask-app-instance
        - name: tmp
          emptyDir: {}
