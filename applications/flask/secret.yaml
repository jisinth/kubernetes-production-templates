# secret.yaml — PLACEHOLDER ONLY. Do not put real credentials here.
#
# SECRET_KEY decodes to "changeme" — Flask uses this to sign session
# cookies and CSRF tokens. A weak/placeholder key here would allow session
# forgery, so this MUST be replaced before any real deployment.
#
# In a real cluster:
#   - Generate a real key: python -c "import secrets; print(secrets.token_hex(32))"
#   - Seal it with kubeseal before committing, see
#     ../../manifests/sealed-secrets, or
#   - Use external-secrets.io to sync SECRET_KEY from Vault/AWS Secrets
#     Manager/etc. at deploy time instead of storing it in git.
apiVersion: v1
kind: Secret
metadata:
  name: flask-app-secret
  namespace: default
  labels:
    app.kubernetes.io/name: flask-app
type: Opaque
data:
  SECRET_KEY: Y2hhbmdlbWU=
