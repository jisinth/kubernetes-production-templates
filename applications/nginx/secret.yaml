# secret.yaml — PLACEHOLDER ONLY.
#
# This Secret exists to demonstrate wiring an htpasswd file into the
# ingress-nginx basic-auth annotation (see ingress.yaml, commented out by
# default). The value below decodes to "changeme" and MUST NOT be used
# anywhere real.
#
# In a real cluster, do not commit plaintext-derived Secrets like this one:
#   - Prefer sealing it with kubeseal, see ../../manifests/sealed-secrets,
#     which produces a SealedSecret safe to store in git, or
#   - Prefer external-secrets.io to sync this value from Vault/AWS Secrets
#     Manager/etc. at runtime and keep no secret material in git at all.
apiVersion: v1
kind: Secret
metadata:
  name: nginx-web-secret
  namespace: default
  labels:
    app.kubernetes.io/name: nginx-web
type: Opaque
data:
  # htpasswd entry for user "admin" / password "changeme" (example.com only)
  htpasswd: YWRtaW46JGFwcjEkY2hhbmdlbWUkcGxhY2Vob2xkZXJoYXNoCg==
