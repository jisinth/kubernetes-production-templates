apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nginx-web
  namespace: default
  labels:
    app.kubernetes.io/name: nginx-web
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: nginx-web
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Only the ingress-nginx controller may reach this pod directly.
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # DNS resolution.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
