apiVersion: v1
kind: ConfigMap
metadata:
  name: nodejs-api-config
  namespace: default
  labels:
    app.kubernetes.io/name: nodejs-api
data:
  NODE_ENV: "production"
  PORT: "3000"
  LOG_LEVEL: "info"
  LOG_FORMAT: "json"
  TRUST_PROXY: "true"
  REQUEST_TIMEOUT_MS: "30000"
  CORS_ALLOWED_ORIGINS: "https://app.example.com"
  RATE_LIMIT_WINDOW_MS: "60000"
  RATE_LIMIT_MAX_REQUESTS: "100"
  UPLOADS_DIR: "/app/uploads"
