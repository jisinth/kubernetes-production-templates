# deployment.yaml — Spring Boot service
#
# JVM heap sizing: container limit is 1536Mi. -XX:MaxRAMPercentage=70.0
# targets ~1075Mi max heap, leaving headroom for metaspace, thread stacks,
# JIT code cache, and direct buffers within the container's memory cgroup.
# CPU requests/limits give the JVM room for JIT warmup and GC pauses.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: springboot-app
  namespace: default
  labels:
    app.kubernetes.io/name: springboot-app
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: springboot-app-service
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: springboot-app
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: springboot-app
        app.kubernetes.io/component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: /actuator/prometheus
        prometheus.io/port: "8080"
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: springboot-app
          image: your-registry/springboot-app:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: springboot-app-config
            - secretRef:
                name: springboot-app-secret
          env:
            - name: JAVA_TOOL_OPTIONS
              value: >-
                -XX:MaxRAMPercentage=70.0
                -XX:InitialRAMPercentage=50.0
                -XX:+ExitOnOutOfMemoryError
                -Djava.security.egd=file:/dev/./urandom
            - name: SPRING_CONFIG_ADDITIONAL_LOCATION
              value: "optional:/config/application-overrides.yaml"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 1536Mi
          # Spring Boot Actuator health groups: liveness = process/deadlock
          # only; readiness = includes downstream dependencies (db, etc.).
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 45
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            periodSeconds: 5
            failureThreshold: 24
          volumeMounts:
            - name: config-overrides
              mountPath: /config
              readOnly: true
            - name: logs
              mountPath: /app/logs
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config-overrides
          configMap:
            name: springboot-app-config
            items:
              - key: application-overrides.yaml
                path: application-overrides.yaml
        - name: logs
          persistentVolumeClaim:
            claimName: springboot-app-logs
        - name: tmp
          emptyDir: {}
