name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  kubeconform:
    name: kubeconform
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          set -euo pipefail
          curl -sSLo kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz kubeconform
          chmod +x kubeconform
          sudo mv kubeconform /usr/local/bin/kubeconform

      - name: Validate manifests/
        run: |
          set -euo pipefail
          # manifests/ also holds Helm values files and raw app config
          # snippets (loki/config.yaml, alertmanager/routes.yaml, etc.)
          # that are intentionally not Kubernetes resources — only
          # kubeconform files that actually declare a top-level `kind:`.
          grep -rlZ '^kind:' manifests --include="*.yaml" --include="*.yml" \
            | xargs -0 kubeconform -strict -ignore-missing-schemas -summary \
                -kubernetes-version 1.29.0 \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'

      - name: Validate applications/
        run: |
          set -euo pipefail
          find applications -type f \( -name "*.yaml" -o -name "*.yml" \) -print0 \
            | xargs -0 kubeconform -strict -ignore-missing-schemas -summary \
                -kubernetes-version 1.29.0 \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
