name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  trivy:
    name: Trivy config scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Trivy config scan (manifests)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: manifests/
          format: sarif
          output: trivy-manifests.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Run Trivy config scan (applications)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-ref: applications/
          format: sarif
          output: trivy-applications.sarif
          severity: CRITICAL,HIGH,MEDIUM
          exit-code: "0"

      - name: Upload Trivy SARIF (manifests)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-manifests.sarif
          category: trivy-manifests

      - name: Upload Trivy SARIF (applications)
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-applications.sarif
          category: trivy-applications

  checkov:
    name: Checkov scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # bridgecrewio/checkov-action@master intermittently fails GitHub's
      # ::env::/::output:: file-command parsing on large scan results
      # (a known upstream issue), which fails the job even with
      # soft_fail: true. Run the checkov CLI directly instead — same
      # scan, no wrapper-action output-plumbing bug.
      - name: Install Checkov
        run: pip install checkov

      - name: Run Checkov (manifests)
        run: |
          checkov -d manifests/ --framework kubernetes \
            --output sarif --output-file-path checkov-manifests --soft-fail --compact

      - name: Run Checkov (applications)
        run: |
          checkov -d applications/ --framework kubernetes \
            --output sarif --output-file-path checkov-applications --soft-fail --compact

      - name: Upload Checkov SARIF (manifests)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-manifests/results_sarif.sarif
          category: checkov-manifests

      - name: Upload Checkov SARIF (applications)
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov-applications/results_sarif.sarif
          category: checkov-applications
